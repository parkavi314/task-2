<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        label {
                display: inline-block;
                width: 200px;
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <label>Roll Number:</label>
     <input type="number" name="rollNumber" ><br><br>
     <label>Student Name:</label>
     <label>First Name:</label>
     <input type="text" name="name">-
     <label>Last Name:</label>
     <input type="text" name="name" style="align-items: center;" ><br><br>
     <label>Father's Name:</label>
     <input type="text" name="fatherName"><br><br>
     <label>Date of Birth:</label>
     <select name="day">
    <option value="placeholder">Day</option>
     <option value="1">Monday</option>
     <option value="2">Tuesday</option>
     <option value="3">Wednesday</option>
     <option value="4">Thursday</option>
     <option value="5">Friday</option>
     <option value="6">Saturday</option>
     <option value="7">Sunday</option>
    </select>-
    <select name="Month">
    <option value="placeholder">Month</option>
     <option value="1">January</option>
     <option value="2">February</option>
     <option value="3">March</option>
     <option value="4">April</option>
     <option value="5">May</option>
     <option value="6">June</option>
     <option value="7">July</option>
     <option value="8">August</option>
     <option value="9">September</option>
     <option value="10">October</option>
     <option value="11">November</option>
     <option value="12">December</option>
    </select>-
    <select name="Year">
    <option value="placeholder">Year</option>
     <option value="2020">2020</option>
     <option value="2021">2021</option>
     <option value="2022">2022</option>
     <option value="2023">2023</option>
     <option value="2024">2024</option>
    </select>
    (DD-MM-YYYY)
    <br><br>
      <label>Mobile Number:</label>
     <input type="tel" name="num" maxlength="3" placeholder="+91" size="2" ;>-
     <input type="tel" name="mobileNumber" maxlength="10" style="width: 400px;align-items: center;"><br><br>
     <label>Email:</label>
     <input type="email" name="email"><br><br>
     <label>Password:</label>
     <input type="password" name="password"><br><br>
     <label>Gender:</label>
     <input type="radio" name="gender" value="male"> Male
     <input type="radio" name="gender" value="female"> Female<br><br>
     <label>Department:</label>
     <input type="checkbox" name="department" value="cse"> CSE
     <input type="checkbox" name="department" value="it"> IT
     <input type="checkbox" name="department" > EEE<br><br>
     <label>Course:</label>
     <select name="course">
    <option value="placeholder">--------Select Current Course--------</option>
     <option value="HTML">HTML</option>
    <option value="CSS">CSS</option>
    <option value="JS">JavaScript</option>
    </select><br><br>
     <label>Student Photo:</label>
     <input type="file" name="photo" ><br><br>
     <label>City:</label>
     <input type="text" name="city"><br><br>
     <label>Address:</label>
     <input type="text" name="address"><br><br>
</body>
</html>
